<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>BuonApp - La tua cucina intelligente</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
            }
          }
        }
      }
    </script>
    
    <style>
      :root {
        --app-height: 100dvh;
      }
      html, body {
        height: var(--app-height);
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
        width: 100%;
      }
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        background-color: #f8fafc; /* slate-50 */
      }
      #root {
        height: var(--app-height);
        display: flex;
        flex-direction: column;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .safe-top { padding-top: env(safe-area-inset-top); }
      
      /* Animation Utilities */
      @keyframes fade-in { 
        from { opacity: 0; transform: scale(0.98); } 
        to { opacity: 1; transform: scale(1); } 
      }
      /* Accelerazione x4 rispetto a 0.3s -> circa 0.08s */
      .animate-fade-in { animation: fade-in 0.1s cubic-bezier(0.2, 0, 0, 1) forwards; }
      
      @keyframes tab-slide {
        from { opacity: 0.3; transform: translateX(20px); filter: blur(2px); }
        to { opacity: 1; transform: translateX(0); filter: blur(0); }
      }
      /* Accelerazione x4 rispetto a 0.6s -> 0.15s */
      .animate-tab-change {
        animation: tab-slide 0.15s cubic-bezier(0.33, 1, 0.68, 1) forwards;
      }
      
      /* Custom Scrollbar for Modal */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 select-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>

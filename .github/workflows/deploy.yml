name: Build et Deploiement Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. On récupère le code
      - name: Récupération du code
        uses: actions/checkout@v4

      # 2. On installe Node.js (le moteur pour construire le site)
      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. On installe les dépendances du projet
      - name: Installation des dépendances
        run: npm ci

      # 4. On CONSTRUIT le site (crée le dossier 'dist')
      - name: Construction (Build)
        run: npm run build

      # 5. On envoie SEULEMENT le dossier 'dist' vers Alwaysdata
      - name: Envoi via SSH (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ssh-nmfs.alwaysdata.net
          username: nmfs_github
          password: ${{ secrets.SSH_PASSWORD }}
          
          # On prend le contenu du dossier 'dist' créé à l'étape 4
          source: "dist/*"
          
          # On l'envoie dans ton dossier serveur
          target: "/home/nmfs/www/_nmfs/BuonApp/v05/"
          
          # IMPORTANT : On retire le préfixe 'dist' pour mettre les fichiers directement dans v05
          strip_components: 1
          
          # On nettoie le dossier distant avant de copier
          rm: true
